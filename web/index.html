<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Double-styrning</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --text: #16181d; --muted: #6b6f78; --line: #dedfe3;
    --accent: #1f5eff; --ok: #1a8f4c; --warn: #b7791f; --bad: #c0392b; --pressed: #dce6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --panel: #1b1d22; --text: #ececee; --muted: #9a9ea8; --line: #2c2f36;
      --accent: #6d95ff; --ok: #43c37b; --warn: #e0a84a; --bad: #ff6b5e; --pressed: #263457;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 18px; margin: 4px 0 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 300px; margin: 0 auto; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--pressed); border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pad button { height: 72px; font-size: 22px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1 1 auto; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], input[type=password] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  input[type=range] { width: 100%; }
  .hint { color: var(--muted); font-size: 13px; }
  details summary { cursor: pointer; color: var(--muted); }
  .grid { display: grid; gap: 10px; margin-top: 10px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <h1>Double-styrning</h1>

  <section class="panel status" aria-live="polite">
    <span><span class="dot" id="dot-link"></span><span id="txt-link">Ansluter…</span></span>
    <span><span class="dot" id="dot-robot"></span><span id="txt-robot">Robot: okänd</span></span>
    <span id="txt-battery"></span>
    <span id="txt-kick"></span>
  </section>

  <section class="panel">
    <div class="pad">
      <span></span><button data-key="up" aria-label="Framåt">▲</button><span></span>
      <button data-key="left" aria-label="Vänster">◀</button>
      <button data-key="stop" aria-label="Stopp">■</button>
      <button data-key="right" aria-label="Höger">▶</button>
      <span></span><button data-key="down" aria-label="Bakåt">▼</button><span></span>
    </div>
    <div class="grid">
      <div>
        <label for="speed">Fart: <span id="speed-val"></span></label>
        <input type="range" id="speed" min="20" max="100" step="5" value="60">
      </div>
      <div class="row">
        <button data-key="poleUp">Höj ⬆</button>
        <button data-key="poleDown">Sänk ⬇</button>
        <button id="btn-park">Parkera</button>
        <button id="btn-unpark">Fäll in stöd</button>
      </div>
      <p class="hint">Tangentbord: <kbd>W A S D</kbd> eller piltangenter kör, <kbd>Shift</kbd> full fart, <kbd>R</kbd>/<kbd>F</kbd> höjer och sänker, <kbd>Mellanslag</kbd> stannar. Roboten stannar själv om styrningen tappar kontakten.</p>
    </div>
  </section>

  <section class="panel grid">
    <div>
      <label for="meet-url">Meet-länk för roboten</label>
      <input type="text" id="meet-url" placeholder="https://meet.google.com/abc-defg-hij" autocomplete="off">
    </div>
    <div class="row">
      <button class="primary" id="btn-meet">Öppna på roboten</button>
      <button id="btn-join">Tryck "Gå med"</button>
      <button id="btn-reload">Ladda om</button>
    </div>
    <p class="hint" id="txt-meet"></p>
  </section>

  <section class="panel">
    <details id="settings">
      <summary>Anslutning</summary>
      <div class="grid">
        <div><label for="cfg-url">Supabase URL</label><input type="text" id="cfg-url" placeholder="https://xxxx.supabase.co"></div>
        <div><label for="cfg-key">Supabase-nyckel (anon/publishable)</label><input type="password" id="cfg-key"></div>
        <div><label for="cfg-room">Rum</label><input type="password" id="cfg-room"></div>
        <div class="row"><button class="primary" id="btn-save">Spara och anslut</button><button id="btn-share">Kopiera länk med inställningar</button></div>
        <p class="hint">Länken innehåller rummet. Dela den bara med dem som ska få köra.</p>
      </div>
    </details>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  var SEND_HZ = 10;
  var TURN_SCALE = 0.7;
  var STORE = 'double-control';
  var STATUS_STALE_MS = 4000;

  // Settings: URL hash (#url=..&key=..&room=..) wins, then localStorage.
  function readConfig() {
    var cfg = {};
    try { cfg = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
    var hash = new URLSearchParams(location.hash.slice(1));
    ['url', 'key', 'room'].forEach(function (k) { if (hash.get(k)) cfg[k] = hash.get(k); });
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    return cfg;
  }
  function writeConfig(cfg) {
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var config = readConfig();
  writeConfig(config);
  $('cfg-url').value = config.url || '';
  $('cfg-key').value = config.key || '';
  $('cfg-room').value = config.room || '';

  var client = null, channel = null, joined = false;
  var lastStatus = null, lastStatusAt = 0;

  function connect() {
    if (channel) { channel.unsubscribe(); channel = null; }
    joined = false;
    renderLink();
    if (!config.url || !config.key || !config.room) {
      $('settings').open = true;
      setLink('bad', 'Fyll i anslutningen nedan');
      return;
    }
    client = window.supabase.createClient(config.url, config.key);
    channel = client.channel(config.room, { config: { broadcast: { self: false, ack: false } } });
    channel.on('broadcast', { event: 'status' }, function (msg) {
      lastStatus = msg.payload || {};
      lastStatusAt = Date.now();
      renderStatus();
    });
    channel.subscribe(function (state) {
      joined = state === 'SUBSCRIBED';
      renderLink();
      if (joined) send('ping', {});
    });
  }

  function send(event, payload) {
    if (!channel || !joined) return;
    channel.send({ type: 'broadcast', event: event, payload: payload });
  }

  // ---- Rendering ----
  function setDot(id, cls) { $(id).className = 'dot ' + (cls || ''); }
  function setLink(cls, text) { setDot('dot-link', cls); $('txt-link').textContent = text; }
  function renderLink() {
    if (!channel) return;
    setLink(joined ? 'ok' : 'warn', joined ? 'Styrning ansluten' : 'Ansluter…');
  }
  function renderStatus() {
    var fresh = lastStatus && Date.now() - lastStatusAt < STATUS_STALE_MS;
    if (!fresh) {
      setDot('dot-robot', 'bad');
      $('txt-robot').textContent = 'iPaden svarar inte';
      $('txt-battery').textContent = '';
      $('txt-kick').textContent = '';
      return;
    }
    var s = lastStatus;
    setDot('dot-robot', s.robot ? 'ok' : 'warn');
    $('txt-robot').textContent = s.robot ? 'Bas ansluten' : 'iPad online, bas ej ansluten';
    var b = Number(s.battery || 0); if (b <= 1) b *= 100;
    $('txt-battery').textContent = s.robot ? 'Batteri ' + Math.round(b) + '%' + (s.charging ? ' (laddar)' : '') : '';
    var kick = { 1: 'Parkerad', 2: 'Kör', 3: 'Parkerar…', 4: 'Fäller in stöd…' }[s.kickstand];
    $('txt-kick').textContent = s.robot && kick ? kick : '';
    $('txt-meet').textContent = s.meet ? 'Roboten visar: ' + s.meet : '';
  }
  setInterval(renderStatus, 1000);

  // ---- Input ----
  var held = {};          // logical key -> true
  var keyMap = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyR: 'poleUp', KeyF: 'poleDown'
  };
  var boost = false;

  function typing(e) { var t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'); }

  document.addEventListener('keydown', function (e) {
    if (typing(e)) return;
    if (e.code === 'Space') { e.preventDefault(); stopAll(); return; }
    if (e.key === 'Shift') boost = true;
    var k = keyMap[e.code];
    if (k) { e.preventDefault(); held[k] = true; highlight(); }
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'Shift') boost = false;
    var k = keyMap[e.code];
    if (k) { delete held[k]; highlight(); }
  });
  window.addEventListener('blur', function () { held = {}; boost = false; highlight(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopAll(); });

  document.querySelectorAll('[data-key]').forEach(function (btn) {
    var k = btn.getAttribute('data-key');
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (k === 'stop') { stopAll(); return; }
      btn.setPointerCapture(e.pointerId);
      held[k] = true; highlight();
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
      btn.addEventListener(ev, function () { delete held[k]; highlight(); });
    });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  function highlight() {
    document.querySelectorAll('[data-key]').forEach(function (btn) {
      btn.classList.toggle('active', !!held[btn.getAttribute('data-key')]);
    });
  }

  function stopAll() {
    held = {}; highlight();
    send('stop', {});
  }

  var speedInput = $('speed');
  function renderSpeed() { $('speed-val').textContent = speedInput.value + '%'; }
  speedInput.addEventListener('input', renderSpeed);
  renderSpeed();

  // Send at a fixed rate while anything is held; the robot stops itself 0.5 s after the last message.
  var wasMoving = false;
  setInterval(function () {
    var speed = boost ? 1 : speedInput.value / 100;
    var d = (held.up ? 1 : 0) - (held.down ? 1 : 0);
    var t = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    var p = (held.poleUp ? 1 : 0) - (held.poleDown ? 1 : 0);
    var moving = d !== 0 || t !== 0 || p !== 0;
    if (moving || wasMoving) {
      send('drive', { d: d * speed, t: t * speed * TURN_SCALE, p: p });
    }
    wasMoving = moving;
  }, 1000 / SEND_HZ);

  // ---- Buttons ----
  $('btn-park').addEventListener('click', function () { send('park', {}); });
  $('btn-unpark').addEventListener('click', function () { send('unpark', {}); });
  $('btn-meet').addEventListener('click', function () {
    var url = $('meet-url').value.trim();
    if (!/^https:\/\/meet\.google\.com\/./.test(url)) { alert('Klistra in en meet.google.com-länk.'); return; }
    send('meet', { url: url });
  });
  $('btn-join').addEventListener('click', function () { send('join', {}); });
  $('btn-reload').addEventListener('click', function () { send('reload', {}); });

  $('btn-save').addEventListener('click', function () {
    config = { url: $('cfg-url').value.trim(), key: $('cfg-key').value.trim(), room: $('cfg-room').value.trim() };
    writeConfig(config);
    $('settings').open = false;
    connect();
  });
  $('btn-share').addEventListener('click', function () {
    var link = location.origin + location.pathname + '#' + new URLSearchParams(config).toString();
    navigator.clipboard.writeText(link).then(function () { $('btn-share').textContent = 'Kopierad'; });
  });

  connect();
})();
</script>
</body>
</html>
